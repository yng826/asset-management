# GitHub Actions: CI + Image Build + GHCR Push
#
# 트리거: main 브랜치 push (PR 은 lint 만, workflow_dispatch 수동 실행 가능)
#
# 흐름:
#   1) lint  : ruff check + format 검사 (개발 가이드)
#   2) build : Dockerfile 멀티스테이지로 이미지 빌드 (소스 포함)
#   3) push  : ghcr.io/<owner>/asset-management:<sha>, :latest 푸시
#
# 참고:
#   - 운영 배포는 운영 서버의 Watchtower 가 담당: 300초 주기로 :latest 를 감지해 asset-manager-bot 교체
#     (이 워크플로는 서버에 접속하지 않음, SSH 배포 X)
#   - 봇 코드는 이미지에 포함되므로 코드 배포에 서버의 git pull 은 불필요.
#     docker-compose.yml·scripts/prod.sh 등 호스트에서 쓰는 파일이 바뀐 경우에만 서버에서 git pull
#     (compose 변경은 Watchtower 가 반영하지 않으므로 git pull 후 docker compose up -d 필요)
#   - 환경변수(DB_PASSWORD 등)는 이미지에 넣지 않고 운영 서버의 .env (compose env_file) 로 주입
name: CI + Build + Push

on:
  push:
    branches: [main]
    # tags: ['v*']  # 태그 릴리스 시 활성화
  pull_request:
    branches: [main]
  workflow_dispatch: # 수동 실행

# GHCR 푸시 시 동시 실행 방지를 위한 락 (같은 브랜치의 동시 빌드 차단)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/asset-management

jobs:
  # ---------- 1) Lint (PR/push 모두 실행) ----------
  lint:
    name: ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ---------- 2) Build + Push (main 만 실행) ----------
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # PR 에서는 이미지만 검증하고 푸시는 생략
    permissions:
      contents: read
      packages: write # GHCR 푸시용

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-stage Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # ${{ steps.meta.outputs.tags }}
          # labels: ${{ steps.meta.outputs.labels }}
          # GHA 레이어 캐시: requirements.txt 가 그대로면 apt·pip 단계 재사용 (소스 COPY 는 내용 기준이라 항상 반영)
          # 의존성·OS 패키지 갱신이 필요하면 requirements.txt 변경 또는 캐시 삭제 후 workflow_dispatch
          cache-from: type=gha
          cache-to: type=gha,mode=max
