# docker-compose.dev.yml
#
# 자산관리 AI 봇 개발용 Compose
#
# 사용법:
#   docker compose -f docker-compose.dev.yml up --build
#   (또는 별칭 docker-dev 가 있다면 docker-dev up)
#
# 주요 기능:
#   1) 호스트 ./ 소스를 컨테이너 /app 으로 바인드 마운트 (핫 리로드 가능)
#   2) ./.env.dev 를 컨테이너 /app/.env 로 마운트 (운영 .env 미오염)
#   3) watchmedo 로 .py 변경 감지 시 main.py 자동 재실행
#   4) 기존 mariadb 컨테이너와 server-bridge 네트워크로 연동
#      -> 컨테이너 이름 'mariadb' 로 DB 접속

services:
  bot-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: asset-manager-bot:dev
    container_name: asset-manager-bot-dev

    # 소스 바인드 마운트: 호스트 디렉터리 변경사항이 컨테이너에 즉시 반영
    volumes:
      # 1) 소스 코드 전체 (볼륨 마운트)
      - ./:/app
      # 2) 개발용 환경변수 파일 (운영 .env 는 컨테이너에 안 들어감)
      - ./.env.dev:/app/.env:ro
      # 3) 로그 디렉터리 (컨테이너 안에서 발생한 로그를 호스트로)
      - ./logs:/app/logs

    # 작업 디렉터리
    working_dir: /app

    # watchmedo auto-restart 패턴:
    #   - 패턴 main.py 변경 시 메인 프로세스 종료 -> watchmedo 가 재기동
    #   - recursion 으로 하위 디렉터리 감시
    #   - 1초 debounce 로 짧은 시간 다중 저장 시 한 번만 재기동
    command:
      - watchmedo
      - auto-restart
      - --recursive
      - --directory=/app
      - --pattern=*.py
      - --debounce=1.0
      - --kill-after=5
      - python
      - main.py

    # 표준 출력 로그 항상 보기
    tty: true
    stdin_open: true

    # 기존 mariadb 컨테이너와 같은 네트워크에 join (DNS로 'mariadb' 이름 접근 가능)
    networks:
      - server-bridge

    # 환경 변수 추가 override (필요시)
    environment:
      # watchmedo 의 SIGTERM/SIGKILL 시퀀스를 정상 처리
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    # 봇 컨테이너만 재시작되어도 영향을 주지 않도록 별도 재시작 정책
    restart: unless-stopped

    # 헬스체크: 봇 프로세스가 살아있는지 main.py 의 단순 호출로 확인 가능하지만
    # 텔레그램 폴링은 외부 API 의존이라 의미가 약함. 단순히 프로세스 헬스만 확인.
    healthcheck:
      test: ["CMD", "python", "-c", "import bot.bot"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

# 기존 mariadb 컨테이너와 동일한 네트워크를 참조
networks:
  server-bridge:
    external: true
    name: server-bridge
