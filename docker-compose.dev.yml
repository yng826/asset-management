# docker-compose.dev.yml
services:
  bot-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: asset-manager-bot:dev
    container_name: asset-manager-bot-dev

    # 개발용 환경변수 파일 지정 (호스트의 .env.dev 사용)
    env_file:
      - .env.dev

    # 소스 바인드 마운트: 코드 수정 시 즉시 컨테이너에 반영
    volumes:
      - ./:/app
      - ./logs:/app/logs

    working_dir: /app

    # 코드 변경 감지 시 자동 재실행
    command:
      - watchmedo
      - auto-restart
      - --recursive
      - --directory=/app
      - --pattern=*.py
      - --debounce=1.0
      - --kill-after=5
      - python
      - main.py

    tty: true
    stdin_open: true

    # networks:
    #   - server-bridge

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    restart: unless-stopped

    # 운영 환경과 일치시킨 프로세스 체크 방식
    healthcheck:
      test: ['CMD-SHELL', "pgrep -f 'python.*main.py' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

