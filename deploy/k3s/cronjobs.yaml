# 시세 수집 CronJob (스케줄은 timeZone Asia/Seoul 기준, 기존 core/scheduler.py 의 수집 작업과 1:1)
# 공통: 동시 실행 금지, 실패 시 1회 재시도(수집은 UPSERT 라 재실행 안전), 완료 Job 은 3일 뒤 정리
---
# 평일 08:30 장전 사전 수집 점검 (알림 없음, 감사 로그만)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector-probe-0830
  namespace: asset-collector
  labels:
    app.kubernetes.io/name: asset-collector
    app.kubernetes.io/component: probe-0830
spec:
  schedule: '30 8 * * 1-5'
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: asset-collector
            app.kubernetes.io/component: probe-0830
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: collector
              image: ghcr.io/yng826/asset-management-collector:latest
              imagePullPolicy: Always
              args: ["probe", "probe_0830"]
              envFrom:
                - configMapRef:
                    name: collector-config
                - secretRef:
                    name: collector-env
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
---
