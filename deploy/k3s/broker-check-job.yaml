# 증권사 API 수동 점검 1회 실행 (토스 토큰 발급 + 종목별 최근 5일 종가 + 최근 7일 체결 건수, 읽기 전용)
#   kubectl create -f deploy/k3s/broker-check-job.yaml   (generateName 이라 apply 가 아닌 create)
#   kubectl -n asset-collector logs -l app.kubernetes.io/component=broker-check --tail=30
apiVersion: batch/v1
kind: Job
metadata:
  generateName: collector-broker-check-
  namespace: asset-collector
  labels:
    app.kubernetes.io/name: asset-collector
    app.kubernetes.io/component: broker-check
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asset-collector
        app.kubernetes.io/component: broker-check
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: collector
          image: ghcr.io/yng826/asset-management-collector:latest
          imagePullPolicy: Always
          args: ["broker-check", "toss", "005930", "AAPL"]
          envFrom:
            - configMapRef:
                name: collector-config
            - secretRef:
                name: collector-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
